<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<style>
  :root{
    --bg:#f3f6ff; --card:#ffffff; --line:#dbe3f8; --text:#17254a; --muted:#5a6a8f;
    --accent:#3a63d1; --accent2:#c93a6e; --chipbg:#eaf0ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
  a{color:var(--accent2);text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  header.top{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:10}
  header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
  nav a{margin-inline-start:18px;color:var(--muted);font-size:14px}
  nav a:hover{color:var(--text)}
  button.lang{background:none;border:1px solid var(--line);color:var(--text);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px}
  .hero{padding:64px 28px 40px;margin-top:20px;border-radius:20px;background:linear-gradient(135deg,#dfe8ff 0%,#ffe6ee 100%);border:1px solid var(--line);display:flex;align-items:center;gap:28px}
  .hero .avatar{width:140px;height:140px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 24px rgba(58,99,209,.25);flex:none;object-fit:cover;background:#fff}
  .heroText{min-width:0}
  .hero h1{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .dt{background:var(--chipbg);border-inline-start:4px solid var(--accent2);border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:14px;color:var(--text)}
  .dt .lbl{color:var(--accent2)}
  .dt p{margin:0;color:var(--text)}
  .live{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;margin-bottom:12px;align-self:flex-start}
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .map .card{border-top:4px solid var(--accent2)}
  .hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 8px;line-height:1.2}
  .hero .role{color:var(--accent);font-weight:600;margin-bottom:14px}
  .hero p{max-width:640px;color:var(--muted);font-size:17px;margin:0 0 22px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);padding:4px 12px;border-radius:999px;font-size:13px;color:var(--muted)}
  section{padding:36px 0}
  h2{font-size:24px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}
  .card h3{margin:0 0 8px;font-size:18px}
  .card p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
  .card .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
  .stack span{font-size:12px;background:var(--chipbg);border:1px solid var(--line);padding:2px 9px;border-radius:6px;color:var(--text)}
  .links{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap}
  .links a{border:1px solid var(--accent);color:var(--accent);padding:6px 14px;border-radius:8px;font-size:13px}
  .links a:hover{background:var(--accent);color:#fff}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
  .gallery img{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
  .gallery .ph{height:80px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
  footer{border-top:1px solid var(--line);padding:32px 0 48px;margin-top:20px}
  .contact{display:flex;flex-wrap:wrap;gap:12px}
  .contact a{background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:10px;color:var(--text);font-size:14px}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  #lightbox img{max-width:100%;max-height:100%;border-radius:10px}
  @media (max-width:760px){ nav{display:none !important} }
  @media (max-width:640px){ .hero{flex-direction:column;text-align:center;padding:36px 20px} .hero .chips{justify-content:center} .hero .avatar{width:112px;height:112px} }
  [dir=rtl] body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <strong id="brand"></strong>
    <div>
      <nav style="display:inline">
        <a href="#data" data-i="nav_data"></a>
        <a href="#auto" data-i="nav_auto"></a>
        <a href="#web" data-i="nav_web"></a>
        <a href="#dtmap" data-i="nav_dt"></a>
        <a href="#contact" data-i="nav_contact"></a>
      </nav>
      <button class="lang" id="langBtn" style="margin-inline-start:16px">العربية</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <img class="avatar" id="avatar" alt="">
    <div class="heroText">
      <h1 id="name"></h1>
      <div class="role" data-i="role"></div>
      <p data-i="about"></p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <section id="data"><h2 data-i="data_t"></h2><p class="sub" data-i="data_s"></p><div class="grid" id="g_data"></div></section>
  <section id="auto"><h2 data-i="auto_t"></h2><p class="sub" data-i="auto_s"></p><div class="grid" id="g_auto"></div></section>
  <section id="web"><h2 data-i="web_t"></h2><p class="sub" data-i="web_s"></p><div class="grid" id="g_web"></div></section>

  <section id="dtmap"><h2 data-i="dt_t"></h2><p class="sub" data-i="dt_s"></p>
    <div class="map">
      <div class="card"><h3 data-i="m1_t"></h3><p data-i="m1_p"></p></div>
      <div class="card"><h3 data-i="m2_t"></h3><p data-i="m2_p"></p></div>
      <div class="card"><h3 data-i="m3_t"></h3><p data-i="m3_p"></p></div>
    </div>
  </section>
</main>

<footer id="contact">
  <div class="wrap">
    <h2 data-i="contact_t"></h2>
    <div class="contact" id="contactLinks"></div>
  </div>
</footer>

<div id="lightbox"><img alt=""></div>

    data_t: "البيانات والذكاء الاصطناعي", data_s: "علم البيانات، اتخاذ القرار المبني على البيانات، التعلم الآلي.",

};

let lang = "en";
const $ = s => document.querySelector(s);

function card(p, t) {
  const el = document.createElement("div");
  el.className = "card";
  let gallery = "";
  if (p.images && p.images.length) {
    gallery = '<div class="gallery">' + p.images.map(src =>
      `<img src="${src}" alt="" loading="lazy" onerror="this.outerHTML='<div class=ph>${t.noimg}</div>'">`).join("") + "</div>";
  }
  const links = [];
  if (p.links.github) links.push(`<a href="${p.links.github}" target="_blank" rel="noopener">${t.github}</a>`);
  if (p.links.demo)   links.push(`<a href="${p.links.demo}" target="_blank" rel="noopener">${t.demo}</a>`);
  if (p.links.file)   links.push(`<a href="${p.links.file}" target="_blank" rel="noopener">${t.file}</a>`);
  el.innerHTML = `
    ${gallery}
    <h3>${p.title[lang]}</h3>
    <div class="lbl">${t.problem}</div><p>${p.problem[lang]}</p>
    <div class="lbl">${t.result}</div><p>${p.result[lang]}</p>
    <div class="dt"><div class="lbl">${t.dt}</div><p>${p.dt[lang]}</p></div>
    ${p.live ? `<div class="live">${t.live}</div>` : ""}
    <div class="stack">${p.stack.map(s => `<span>${s}</span>`).join("")}</div>
    <div class="links">${links.join("")}</div>`;
  return el;
}

function render() {
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;
  $("#name").textContent = CONFIG.name[lang];
  $("#brand").textContent = CONFIG.name[lang];
  $("#avatar").src = IMG.avatar;
  document.title = CONFIG.name[lang] + " — Portfolio";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t[e.dataset.i]);
  $("#langBtn").textContent = lang === "en" ? "العربية" : "English";
  $("#chips").innerHTML = ["Machine Learning","Automation","APIs & Webhooks","Bots","JavaScript","Databases"]
    .map(c => `<span class="chip">${c}</span>`).join("");
  ["data","auto","web"].forEach(k => {
    const g = $("#g_" + k); g.innerHTML = "";
    CONFIG.projects[k].forEach(p => g.appendChild(card(p, t)));
  });
  $("#contactLinks").innerHTML = CONFIG.contact.map(c =>
    `<a href="${c.href}" target="_blank" rel="noopener">${c.label}</a>`).join("");
}

$("#langBtn").onclick = () => { lang = lang === "en" ? "ar" : "en"; render(); };
document.addEventListener("click", e => {
  if (e.target.matches(".gallery img")) { $("#lightbox img").src = e.target.src; $("#lightbox").style.display = "flex"; }
  else if (e.target.closest("#lightbox")) { $("#lightbox").style.display = "none"; }
});
render();
</script>
</body>
</html>
